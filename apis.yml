name: Arctus Aerospace
description: 'Arctus Aerospace is a Bengaluru, India based deep-tech startup building high-altitude,
  long-endurance autonomous unmanned aircraft (MALE/HALE UAVs) for real-time Earth observation and
  geospatial intelligence. Its platforms are designed to operate near 45,000 feet for over 24 hours
  while carrying payloads up to 250 kg, delivering centimeter-level multispectral imagery as a
  "zero-infrastructure" alternative to satellites. The company positions itself as a data-as-a-service
  provider, selling subscription-based aerial coverage for energy, infrastructure, climate, defense,
  and agriculture use cases. Founded in 2024 by Shreepoorna S. Rao, Arctus raised a $2.6M pre-seed
  round led by Version One Ventures (with South Park Commons, gradCapital, and angels). As of this
  writing the company is pre-product from an API standpoint and publishes no public developer surface,
  API, or documentation; this profile was surfaced as a Version One Ventures portfolio lead.'
